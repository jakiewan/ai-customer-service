name: Agent regression

on:
  pull_request:
    branches: [master]
  push:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  agent-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globalcare_hardening_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GLOBALCARE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:55432/globalcare_hardening_test
      GLOBALCARE_LLM_MODE: mock
      GLOBALCARE_EMBEDDING_MODE: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compile and regress
        run: |
          python -m compileall -q agent_service/app agent_service/mcp_server.py
          python -m pytest -q agent_service/tests --junitxml=agent-test-results.xml
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-test-results
          path: agent-test-results.xml
