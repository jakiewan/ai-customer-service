<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
  <title id="title">GlobalCare Case Draft 核心时序图</title>
  <desc id="desc">用户通过 Vue 页面向 FastAPI 发送聊天消息，LangGraph 使用 pgvector 检索政策、通过 MCP 查询 Spring Boot，校验后创建 Case Draft 并通过 SSE 返回给前端。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    .title { fill:#f8fafc; font-size:18px; font-weight:700; }
    .subtitle { fill:#94a3b8; font-size:10px; }
    .actor { fill:#f8fafc; font-size:10px; font-weight:600; text-anchor:middle; }
    .small { fill:#94a3b8; font-size:8px; text-anchor:middle; }
    .msg { fill:#e2e8f0; font-size:8px; text-anchor:middle; }
    .ret { fill:#94a3b8; font-size:8px; text-anchor:middle; font-style:italic; }
    .frame { fill:#94a3b8; font-size:8px; font-style:italic; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0,10 3.5,0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1320" height="860" fill="#0f172a"/>
  <rect width="1320" height="860" fill="url(#grid)"/>
  <text x="35" y="36" class="title">GlobalCare Web · Case Draft 核心时序</text>
  <text x="35" y="55" class="subtitle">用户确认、正式 Case 和 Work Order 位于本时序图的外部下游</text>

  <g>
    <rect x="40" y="85" width="120" height="44" rx="7" fill="#0f172a"/>
    <rect x="40" y="85" width="120" height="44" rx="7" fill="rgba(8,51,68,.40)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="100" y="111" class="actor">用户</text>
    <line x1="100" y1="129" x2="100" y2="815" stroke="#334155" stroke-dasharray="6 4"/>
  </g>
  <g>
    <rect x="230" y="85" width="120" height="44" rx="7" fill="#0f172a"/>
    <rect x="230" y="85" width="120" height="44" rx="7" fill="rgba(8,51,68,.40)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="290" y="111" class="actor">Vue 3</text>
    <line x1="290" y1="129" x2="290" y2="815" stroke="#334155" stroke-dasharray="6 4"/>
  </g>
  <g>
    <rect x="420" y="85" width="140" height="44" rx="7" fill="#0f172a"/>
    <rect x="420" y="85" width="140" height="44" rx="7" fill="rgba(6,78,59,.40)" stroke="#34d399" stroke-width="1.5"/>
    <text x="490" y="111" class="actor">FastAPI</text>
    <line x1="490" y1="129" x2="490" y2="815" stroke="#334155" stroke-dasharray="6 4"/>
  </g>
  <g>
    <rect x="640" y="85" width="160" height="44" rx="7" fill="#0f172a"/>
    <rect x="640" y="85" width="160" height="44" rx="7" fill="rgba(6,78,59,.40)" stroke="#34d399" stroke-width="1.5"/>
    <text x="720" y="111" class="actor">LangGraph + LangChain</text>
    <line x1="720" y1="129" x2="720" y2="815" stroke="#334155" stroke-dasharray="6 4"/>
  </g>
  <g>
    <rect x="870" y="85" width="150" height="44" rx="7" fill="#0f172a"/>
    <rect x="870" y="85" width="150" height="44" rx="7" fill="rgba(76,29,149,.40)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="945" y="111" class="actor">pgvector</text>
    <line x1="945" y1="129" x2="945" y2="815" stroke="#334155" stroke-dasharray="6 4"/>
  </g>
  <g>
    <rect x="1090" y="85" width="180" height="44" rx="7" fill="#0f172a"/>
    <rect x="1090" y="85" width="180" height="44" rx="7" fill="rgba(30,41,59,.55)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1180" y="111" class="actor">MCP / Spring Boot</text>
    <line x1="1180" y1="129" x2="1180" y2="815" stroke="#334155" stroke-dasharray="6 4"/>
  </g>

  <rect x="485" y="168" width="10" height="570" rx="2" fill="rgba(6,78,59,.65)" stroke="#34d399"/>
  <rect x="715" y="215" width="10" height="450" rx="2" fill="rgba(6,78,59,.65)" stroke="#34d399"/>

  <line x1="100" y1="170" x2="290" y2="170" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="160" class="msg">1. 输入售后问题</text>
  <line x1="290" y1="215" x2="490" y2="215" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="205" class="msg">2. POST /messages/stream</text>
  <line x1="490" y1="260" x2="720" y2="260" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="250" class="msg">3. invoke / resume graph</text>
  <path d="M720 300 H770 V325 H720" fill="none" stroke="#34d399" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="782" y="318" class="msg">4. 意图识别与缺失字段</text>

  <line x1="720" y1="370" x2="945" y2="370" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="832" y="360" class="msg">5. 检索政策（市场/版本过滤）</text>
  <line x1="945" y1="410" x2="720" y2="410" stroke="#64748b" stroke-width="1.1" stroke-dasharray="6 3" marker-end="url(#arrow-open)"/>
  <text x="832" y="400" class="ret">政策证据与引用片段</text>

  <line x1="720" y1="455" x2="1180" y2="455" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="950" y="445" class="msg">6. MCP 查询设备、订单、维修状态</text>
  <line x1="1180" y1="495" x2="720" y2="495" stroke="#64748b" stroke-width="1.1" stroke-dasharray="6 3" marker-end="url(#arrow-open)"/>
  <text x="950" y="485" class="ret">结构化业务事实或错误码</text>

  <path d="M720 535 H770 V560 H720" fill="none" stroke="#34d399" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="786" y="553" class="msg">7. 生成并校验 Case Draft</text>

  <rect x="645" y="585" width="560" height="155" rx="5" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="645" y="585" width="55" height="18" rx="4" fill="rgba(30,41,59,.8)" stroke="#64748b"/>
  <text x="672" y="598" class="small">alt</text>
  <text x="710" y="598" class="frame">[草稿通过字段、证据与事实校验]</text>
  <line x1="720" y1="630" x2="1180" y2="630" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="950" y="620" class="msg">8. POST /internal/case-drafts</text>
  <line x1="1180" y1="665" x2="720" y2="665" stroke="#64748b" stroke-width="1.1" stroke-dasharray="6 3" marker-end="url(#arrow-open)"/>
  <text x="950" y="655" class="ret">case_draft_id + WAITING_HUMAN_CONFIRMATION</text>

  <line x1="720" y1="710" x2="490" y2="710" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="700" class="msg">9. case_draft_created 事件</text>
  <line x1="490" y1="755" x2="290" y2="755" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="745" class="msg">10. SSE：草稿与政策引用</text>
  <line x1="290" y1="795" x2="100" y2="795" stroke="#64748b" stroke-width="1.1" stroke-dasharray="6 3" marker-end="url(#arrow-open)"/>
  <text x="195" y="785" class="ret">展示草稿，等待人工客服确认</text>

  <rect x="35" y="825" width="1230" height="22" rx="5" fill="rgba(136,19,55,.25)" stroke="#fb7185" stroke-width="1"/>
  <text x="650" y="840" class="small">无可靠政策或业务事实时：LangGraph 返回 human_required；不自动转人工，不创建正式 Case 或 Work Order。</text>
</svg>
