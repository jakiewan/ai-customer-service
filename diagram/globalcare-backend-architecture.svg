<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">GlobalCare Web 后端架构图</title>
  <desc id="desc">Vue 客户端通过 FastAPI 访问 LangGraph 售后 Agent，Agent 使用 LangChain、MiniMax-M3、pgvector 和 MCP 查询 Spring Boot 模拟业务服务，并创建 Case Draft。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    .title { fill:#f8fafc; font-size:18px; font-weight:700; }
    .subtitle { fill:#94a3b8; font-size:10px; }
    .region { fill:none; stroke:#fbbf24; stroke-width:1; stroke-dasharray:8 4; }
    .region-label { fill:#fbbf24; font-size:9px; font-weight:600; }
    .box { stroke-width:1.5; }
    .name { fill:#f8fafc; font-size:12px; font-weight:600; text-anchor:middle; }
    .desc { fill:#94a3b8; font-size:9px; text-anchor:middle; }
    .label { fill:#cbd5e1; font-size:8px; text-anchor:middle; }
    .legend { fill:#94a3b8; font-size:8px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="#0f172a"/>
  <rect width="1240" height="760" fill="url(#grid)"/>
  <text x="35" y="38" class="title">GlobalCare Web · 后端架构</text>
  <text x="35" y="57" class="subtitle">Agent 仅创建 Case Draft；人工确认和 Work Order 属于既有 Java 下游</text>

  <rect x="24" y="92" width="180" height="500" rx="12" class="region"/>
  <text x="38" y="112" class="region-label">CLIENT LAYER</text>
  <rect x="45" y="220" width="138" height="70" rx="8" fill="#0f172a"/>
  <rect x="45" y="220" width="138" height="70" rx="8" fill="rgba(8,51,68,.40)" stroke="#22d3ee" class="box"/>
  <text x="114" y="248" class="name">Vue 3 Web Chat</text>
  <text x="114" y="266" class="desc">SSE · 草稿 · 政策引用</text>

  <rect x="238" y="92" width="274" height="500" rx="12" class="region"/>
  <text x="252" y="112" class="region-label">AGENT SERVICE · PYTHON</text>
  <rect x="270" y="145" width="210" height="68" rx="8" fill="#0f172a"/>
  <rect x="270" y="145" width="210" height="68" rx="8" fill="rgba(6,78,59,.40)" stroke="#34d399" class="box"/>
  <text x="375" y="172" class="name">FastAPI Agent API</text>
  <text x="375" y="190" class="desc">HTTP · SSE · DTO · Health</text>

  <rect x="270" y="263" width="210" height="92" rx="8" fill="#0f172a"/>
  <rect x="270" y="263" width="210" height="92" rx="8" fill="rgba(6,78,59,.40)" stroke="#34d399" class="box"/>
  <text x="375" y="291" class="name">LangGraph StateGraph</text>
  <text x="375" y="309" class="desc">收集 · 检索 · 查询</text>
  <text x="375" y="325" class="desc">草稿 · Checkpoint · Guardrails</text>

  <rect x="270" y="405" width="210" height="92" rx="8" fill="#0f172a"/>
  <rect x="270" y="405" width="210" height="92" rx="8" fill="rgba(6,78,59,.40)" stroke="#34d399" class="box"/>
  <text x="375" y="433" class="name">LangChain Runtime</text>
  <text x="375" y="451" class="desc">MiniMax-M3 · RAG</text>
  <text x="375" y="467" class="desc">Structured Output · MCP Adapter</text>

  <rect x="546" y="92" width="310" height="500" rx="12" class="region"/>
  <text x="560" y="112" class="region-label">DATA &amp; INTEGRATION</text>
  <g transform="translate(570 156)">
    <rect x="0" y="12" width="170" height="64" rx="3" fill="#0f172a"/>
    <ellipse cx="85" cy="12" rx="85" ry="13" fill="#0f172a"/>
    <ellipse cx="85" cy="76" rx="85" ry="13" fill="#0f172a"/>
    <rect x="0" y="12" width="170" height="64" fill="rgba(76,29,149,.40)"/>
    <ellipse cx="85" cy="12" rx="85" ry="13" fill="rgba(76,29,149,.40)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="85" cy="76" rx="85" ry="13" fill="rgba(76,29,149,.40)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="170" y1="12" x2="170" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="85" y="43" class="name">PostgreSQL + pgvector</text>
    <text x="85" y="60" class="desc">政策 · Checkpoint · 审计</text>
  </g>

  <rect x="570" y="306" width="170" height="72" rx="8" fill="#0f172a"/>
  <rect x="570" y="306" width="170" height="72" rx="8" fill="rgba(251,146,60,.20)" stroke="#fb923c" class="box"/>
  <text x="655" y="335" class="name">FastMCP Server</text>
  <text x="655" y="353" class="desc">只读业务工具 · Schema</text>

  <rect x="570" y="430" width="170" height="72" rx="8" fill="#0f172a"/>
  <rect x="570" y="430" width="170" height="72" rx="8" fill="rgba(76,29,149,.40)" stroke="#a78bfa" class="box"/>
  <text x="655" y="459" class="name">Dify Baseline</text>
  <text x="655" y="477" class="desc">FAQ 对照 · Prompt 实验</text>

  <rect x="890" y="92" width="320" height="500" rx="12" class="region"/>
  <text x="904" y="112" class="region-label">SIMULATED JAVA DOMAIN SERVICE</text>
  <rect x="920" y="214" width="260" height="95" rx="8" fill="#0f172a"/>
  <rect x="920" y="214" width="260" height="95" rx="8" fill="rgba(30,41,59,.55)" stroke="#94a3b8" class="box"/>
  <text x="1050" y="244" class="name">Spring Boot Domain API</text>
  <text x="1050" y="262" class="desc">设备 · 订单 · 维修状态查询</text>
  <text x="1050" y="278" class="desc">Case Draft 创建接口</text>

  <rect x="920" y="380" width="260" height="95" rx="8" fill="#0f172a"/>
  <rect x="920" y="380" width="260" height="95" rx="8" fill="rgba(136,19,55,.40)" stroke="#fb7185" class="box"/>
  <text x="1050" y="410" class="name">External Downstream</text>
  <text x="1050" y="428" class="desc">人工确认 · 正式 Case</text>
  <text x="1050" y="444" class="desc">Work Order（第一版不实现）</text>

  <path d="M183 255 H270" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrow-cyan)"/>
  <text x="226" y="246" class="label">HTTP + SSE</text>
  <path d="M375 213 V263" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <path d="M375 355 V405" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <path d="M480 309 H570" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="525" y="300" class="label">checkpoint / audit</text>
  <path d="M480 451 H535 V342 H570" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="522" y="432" class="label">MCP tools</text>
  <path d="M740 342 H920" fill="none" stroke="#fb923c" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <text x="830" y="333" class="label">internal HTTP</text>
  <path d="M740 202 H820 V430 H740" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow-violet)"/>
  <text x="816" y="422" class="label">baseline only</text>
  <path d="M1050 309 V380" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)"/>
  <text x="1098" y="350" class="label">external boundary</text>

  <rect x="35" y="640" width="1170" height="84" rx="8" fill="rgba(30,41,59,.55)" stroke="#334155" stroke-width="1"/>
  <text x="52" y="665" fill="#f8fafc" font-size="10" font-weight="600">关键边界</text>
  <text x="52" y="688" class="legend">1. 模型只调用查询工具；Case Draft 由 LangGraph 应用节点在校验后创建。</text>
  <text x="52" y="705" class="legend">2. 人工确认、正式 Case、Work Order 与通知均属于第一版范围之外的既有下游能力。</text>
</svg>
