<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
<title id="title">状态与运行模式：一次回复结束，不等于售后业务结束</title><desc id="desc">区分节点阶段、会话结果和正式工单，防止把系统提示误读为业务承诺。</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2463c5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087c80"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#916013"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ab394c"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#54677d"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45} .code{font-family:"SFMono-Regular",Consolas,"PingFang SC",monospace}</style>
<rect width="1600" height="1260" fill="#fff"/>
<rect width="1600" height="12" fill="#2463c5"/>
<text x="48" y="51" font-size="19" style="fill:#54677d" font-weight="400" text-anchor="start">GLOBALCARE  /  当前实现图集  /  07</text>
<text x="48" y="104" font-size="37" style="fill:#172c45" font-weight="600" text-anchor="start">状态与运行模式：一次回复结束，不等于售后业务结束</text>
<rect x="48" y="129" width="1504" height="68" rx="12" fill="#eff5ff" stroke="none"/>
<text x="72" y="172" font-size="25" style="fill:#2463c5" font-weight="600" text-anchor="start">解决的问题：区分节点阶段、会话结果和正式工单，防止把系统提示误读为业务承诺。</text>
<text x="48" y="1213" font-size="18" style="fill:#54677d" font-weight="400" text-anchor="start">源码快照 b764afe · 2026-10-10 · 静态核对；业务与政策为模拟数据，图示不代表生产验收。</text>
<text x="48" y="1240" font-size="16" style="fill:#54677d" font-weight="400" text-anchor="start">依据：constants.py / graph.py / service.py / config.py / checkpointer.py / main.py</text>
<g data-box="48,228,1504,141">
<rect x="48" y="228" width="1504" height="141" rx="16" fill="#eff5ff" stroke="#2463c5"/>
<rect x="66" y="248" width="5" height="29" rx="2" fill="#2463c5" stroke="none"/>
<text x="84" y="272" font-size="25" style="fill:#2463c5" font-weight="600" text-anchor="start">每条新消息进入 classify_intent，重置本轮 phase / conversation_status 为 AI_ACTIVE</text>
<text x="72" y="306" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">graph 的 END 表示本轮图执行结束；普通答复 / 追问通常仍是 AI_ACTIVE，会话可继续。</text>
<text x="72" y="334" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">节点 phase 用于 SSE 进度展示；conversation_status 用于会话结果；它们不是同一字段。</text>
</g>
<text x="66" y="413" font-size="22" style="fill:#2463c5" font-weight="600" text-anchor="start">场景 / 节点</text>
<text x="424" y="413" font-size="22" style="fill:#2463c5" font-weight="600" text-anchor="start">当前 phase</text>
<text x="856" y="413" font-size="22" style="fill:#2463c5" font-weight="600" text-anchor="start">conversation_status</text>
<text x="1198" y="413" font-size="22" style="fill:#2463c5" font-weight="600" text-anchor="start">对客户的含义</text>
<rect x="48" y="435" width="1504" height="64" rx="8" fill="#f5f8fc" stroke="none"/>
<text x="66" y="474" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">一般引导 / 政策答复</text>
<text x="424" y="474" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">AI_ACTIVE / RETRIEVING_POLICY</text>
<text x="856" y="474" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">AI_ACTIVE</text>
<text x="1198" y="474" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">本轮答复完成，可继续问。</text>
<rect x="48" y="505" width="1504" height="64" rx="8" fill="#fff" stroke="none"/>
<text x="66" y="544" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">缺字段 collect_info</text>
<text x="424" y="544" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">COLLECTING_INFO</text>
<text x="856" y="544" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">AI_ACTIVE</text>
<text x="1198" y="544" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">追问；等待下一条消息。</text>
<rect x="48" y="575" width="1504" height="64" rx="8" fill="#f5f8fc" stroke="none"/>
<text x="66" y="614" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">维修进度 query_business</text>
<text x="424" y="614" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">QUERYING_BUSINESS_DATA</text>
<text x="856" y="614" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">AI_ACTIVE</text>
<text x="1198" y="614" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">读取既有记录，无完成时限承诺。</text>
<rect x="48" y="645" width="1504" height="64" rx="8" fill="#fff" stroke="none"/>
<text x="66" y="684" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">新草稿成功 / 已有草稿复用</text>
<text x="424" y="684" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">CASE_DRAFT_CREATED</text>
<text x="856" y="684" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">CASE_DRAFT_CREATED</text>
<text x="1198" y="684" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">仅表示受理草稿阶段完成。</text>
<rect x="48" y="715" width="1504" height="64" rx="8" fill="#f5f8fc" stroke="none"/>
<text x="66" y="754" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">证据 / 事实 / 写入无法确定</text>
<text x="424" y="754" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">AI_CANNOT_RESOLVE</text>
<text x="856" y="754" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">AI_CANNOT_RESOLVE</text>
<text x="1198" y="754" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">human_required：需人工继续。</text>
<rect x="48" y="785" width="1504" height="64" rx="8" fill="#fff" stroke="none"/>
<text x="66" y="824" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">图运行失败 / 预算超限</text>
<text x="424" y="824" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">失败路径保存 FAILED</text>
<text x="856" y="824" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start" class="code">FAILED（结果成功保存时）</text>
<text x="1198" y="824" font-size="18" style="fill:#172c45" font-weight="400" text-anchor="start">error + done；超时需核对。</text>
<text x="48" y="893" font-size="21" style="fill:#ab394c" font-weight="400" text-anchor="start">COMPLETED 虽在枚举中定义，但当前普通成功路径通常不写入该状态；done 事件不等于 status=COMPLETED。</text>
<g data-box="48,928,736,225">
<rect x="48" y="928" width="736" height="225" rx="16" fill="#eff5ff" stroke="#2463c5"/>
<rect x="66" y="948" width="5" height="29" rx="2" fill="#2463c5" stroke="none"/>
<text x="84" y="972" font-size="25" style="fill:#2463c5" font-weight="600" text-anchor="start">默认开发模式：验证流程与演示</text>
<text x="72" y="1006" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">auth=demo；模型 mock；Embedding hash。</text>
<text x="72" y="1034" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">业务 / MCP mock；政策 / Store / checkpoint memory。</text>
<text x="72" y="1062" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">可离线运行；内存状态不跨重启。</text>
<text x="72" y="1090" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">启动 / 单测通过不代表真实业务、模型或数据库已联调。</text>
</g>
<g data-box="816,928,736,225">
<rect x="816" y="928" width="736" height="225" rx="16" fill="#fff7e8" stroke="#916013"/>
<rect x="834" y="948" width="5" height="29" rx="2" fill="#916013" stroke="none"/>
<text x="852" y="972" font-size="25" style="fill:#916013" font-weight="600" text-anchor="start">staging / production：已有配置门禁</text>
<text x="840" y="1006" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">JWT + PostgreSQL Store / checkpoint + pgvector。</text>
<text x="840" y="1034" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">HuggingFace + 不允许 fallback + MiniMax。</text>
<text x="840" y="1062" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">HTTP 业务 / MCP 带凭证；明确 HTTPS / CORS。</text>
<text x="840" y="1090" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">批准且非模拟政策；专用数据库账号 / 非示例凭证。</text>
<text x="840" y="1118" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">门禁只是必要条件；真实接入、容量与上线仍需验收。</text>
</g>
</svg>
