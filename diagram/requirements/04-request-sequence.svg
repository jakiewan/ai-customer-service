<text x="290" y="283" font-size="23" style="fill:#2463c5" font-weight="600" text-anchor="middle">FastAPI</text>
<line x1="290" y1="302" x2="290" y2="1457" stroke="#bccbda" stroke-dasharray="6 6"/>
<rect x="397" y="250" width="156" height="52" rx="10" fill="#eff5ff" stroke="#2463c5"/>
<text x="475" y="283" font-size="23" style="fill:#2463c5" font-weight="600" text-anchor="middle">会话服务</text>
<line x1="475" y1="302" x2="475" y2="1457" stroke="#bccbda" stroke-dasharray="6 6"/>
<rect x="582" y="250" width="156" height="52" rx="10" fill="#eff5ff" stroke="#2463c5"/>
<text x="660" y="283" font-size="23" style="fill:#2463c5" font-weight="600" text-anchor="middle">LangGraph</text>
<line x1="660" y1="302" x2="660" y2="1457" stroke="#bccbda" stroke-dasharray="6 6"/>
<rect x="767" y="250" width="156" height="52" rx="10" fill="#eff5ff" stroke="#2463c5"/>
<text x="845" y="283" font-size="23" style="fill:#2463c5" font-weight="600" text-anchor="middle">PolicyStore</text>
<line x1="845" y1="302" x2="845" y2="1457" stroke="#bccbda" stroke-dasharray="6 6"/>
<rect x="952" y="250" width="156" height="52" rx="10" fill="#eff5ff" stroke="#2463c5"/>
<text x="1030" y="283" font-size="23" style="fill:#2463c5" font-weight="600" text-anchor="middle">FastMCP</text>
<line x1="1030" y1="302" x2="1030" y2="1457" stroke="#bccbda" stroke-dasharray="6 6"/>
<rect x="1137" y="250" width="156" height="52" rx="10" fill="#eff5ff" stroke="#2463c5"/>
