<rect width="1600" height="1700" fill="#fff"/>
<rect width="1600" height="12" fill="#2463c5"/>
<text x="48" y="51" font-size="19" style="fill:#54677d" font-weight="400" text-anchor="start">GLOBALCARE  /  当前实现图集  /  04</text>
<text x="48" y="104" font-size="37" style="fill:#172c45" font-weight="600" text-anchor="start">一次新维修受理的时序：取证、写入、持久化、SSE</text>
<rect x="48" y="129" width="1504" height="68" rx="12" fill="#eff5ff" stroke="none"/>
<text x="72" y="172" font-size="25" style="fill:#2463c5" font-weight="600" text-anchor="start">解决的问题：保证先核验证据和写入结果，再向客户宣布草稿已保存。</text>
<text x="48" y="1653" font-size="18" style="fill:#54677d" font-weight="400" text-anchor="start">源码快照 b764afe · 2026-10-10 · 静态核对；业务与政策为模拟数据，图示不代表生产验收。</text>
<text x="48" y="1680" font-size="16" style="fill:#54677d" font-weight="400" text-anchor="start">依据：main.py / service.py / graph.py / store.py / postgres_store.py / mcp_server.py / business.py</text>
<text x="48" y="230" font-size="21" style="fill:#54677d" font-weight="400" text-anchor="start">场景：已创建会话，维修申请信息齐全；查询走 MCP、写入走 HTTP；省略模型分类内部调用。</text>
<rect x="27" y="250" width="156" height="52" rx="10" fill="#eff5ff" stroke="#2463c5"/>
<text x="105" y="283" font-size="23" style="fill:#2463c5" font-weight="600" text-anchor="middle">Vue 网页</text>
<line x1="105" y1="302" x2="105" y2="1457" stroke="#bccbda" stroke-dasharray="6 6"/>
